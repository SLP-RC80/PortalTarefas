
name: PortalTarefas - CI/CD

on:
  push:
    branches:
      - atividade-4-cicd
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portaltarefas-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1 - BACKEND .NET
  # ==========================================

  backend:
    name: Backend - .NET 10

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: |
          dotnet restore \
            PortalTarefas/PortalTarefas.Tests/PortalTarefas.Tests.csproj

      - name: Build da API
        run: |
          dotnet build \
            PortalTarefas/PortalTarefas.Web/PortalTarefas.Web.csproj \
            --configuration Release \
            --no-restore

      - name: Build do projeto de testes
        run: |
          dotnet build \
            PortalTarefas/PortalTarefas.Tests/PortalTarefas.Tests.csproj \
            --configuration Release \
            --no-restore

      - name: Executar testes automatizados
        run: |
          dotnet test \
            PortalTarefas/PortalTarefas.Tests/PortalTarefas.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.sha }}
          path: TestResults/
          if-no-files-found: warn


  # ==========================================
  # JOB 2 - FRONTEND REACT
  # ==========================================

  frontend:
    name: Frontend - React

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PortalTarefas.Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: PortalTarefas.Frontend
        run: npm ci

      - name: Executar analise estatica
        working-directory: PortalTarefas.Frontend
        run: npm run lint

      - name: Build de producao
        working-directory: PortalTarefas.Frontend
        run: npm run build

      - name: Armazenar build do frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: PortalTarefas.Frontend/dist/


  # ==========================================
  # JOB 3 - DOCKER E PUBLICACAO
  # ==========================================

  docker:
    name: Docker - Build e GHCR

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar nomes das imagens
        id: vars
        shell: bash
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          BRANCH="${GITHUB_REF_NAME//\//-}"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------
      # IMAGEM DA API
      # --------------------------------------

      - name: Build e publicacao da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/portaltarefas-api:sha-${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner }}/portaltarefas-api:${{ steps.vars.outputs.branch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # --------------------------------------
      # IMAGEM DO FRONTEND
      # --------------------------------------

      - name: Build e publicacao do Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./PortalTarefas.Frontend
          file: ./PortalTarefas.Frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/portaltarefas-frontend:sha-${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner }}/portaltarefas-frontend:${{ steps.vars.outputs.branch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Registrar rastreabilidade
        if: github.event_name == 'push'
        run: |
          echo "Publicacao concluida." >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "API: ghcr.io/${{ steps.vars.outputs.owner }}/portaltarefas-api:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ghcr.io/${{ steps.vars.outputs.owner }}/portaltarefas-frontend:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
